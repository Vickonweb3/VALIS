name: asset-pipeline
on:
  push:
    paths: ["tools/asset-pipeline/**", ".github/workflows/asset-pipeline.yml"]
  pull_request:
    paths: ["tools/asset-pipeline/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/asset-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Unit tests (real-asset tests run when the GLB is present)
        run: |
          GLB=../../app/src/main/assets/valis/VALIS_rigged.glb
          if [ -f "$GLB" ] && ! head -c 4 "$GLB" | grep -q glTF; then echo "GLB is an LFS pointer; skipping asset tests"; unset GLB; fi
          VALIS_GLB="$GLB" python -m unittest discover -s tests -t . -v
